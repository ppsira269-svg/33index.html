<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PAPER &amp; MORE – ระบบบัญชี Periodic</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#1f4d3a;--on:#fff;--cream:#f6f0e1;--bg:#fbf8f0;--card:#fff;--tx:#1d2b24;--mut:#6b7a72;--line:#e3dccb;--red:#b3392f;--ok:#2d7a4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--g:#7fc4a0;--on:#10281d;--cream:#26302a;--bg:#161c18;--card:#1e2621;--tx:#ecefe9;--mut:#9aa89f;--line:#33403a;--red:#ff8a7d;--ok:#7fd1a0}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.55 Sarabun,system-ui,sans-serif}
header{background:var(--g);color:var(--on);padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{margin:0;font:700 22px Fraunces,Sarabun,serif;letter-spacing:.5px}header small{display:block;opacity:.85;font:400 13px Sarabun}
.hb button{background:var(--cream);color:var(--g);margin-left:6px}
.app{display:grid;grid-template-columns:1fr}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px;background:var(--cream);border-bottom:1px solid var(--line)}
nav a{white-space:nowrap;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--tx);font-weight:600}
nav a.on{background:var(--g);color:var(--on)}nav i{display:none;font-style:normal;color:var(--mut);font-size:12px;margin:10px 0 2px 12px}
main{padding:16px;min-width:0}
@media(min-width:900px){.app{grid-template-columns:250px 1fr;min-height:calc(100vh - 70px)}nav{flex-direction:column;border-right:1px solid var(--line);border-bottom:0;padding:14px 10px}nav i{display:block}}
h2{font:700 22px Fraunces,Sarabun,serif;color:var(--g);margin:0 0 12px}h3{margin:0 0 10px;color:var(--g)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--g);border-radius:10px;padding:12px}
.st b{display:block;font-size:20px}.st span{color:var(--mut);font-size:13px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:10px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}.w{grid-column:1/-1}
input,select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);min-width:0}
button{font:600 14px Sarabun;border:0;border-radius:8px;padding:8px 14px;background:var(--g);color:var(--on);cursor:pointer}
button.s{background:var(--cream);color:var(--g);border:1px solid var(--line)}button.d{background:var(--red);color:#fff}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--cream);color:var(--g);white-space:nowrap}
.r{text-align:right;font-variant-numeric:tabular-nums}tfoot td{font-weight:700;background:var(--cream)}
.fl{padding:10px 14px;border-radius:8px;margin-bottom:12px;font-weight:600}.fl.ok{background:var(--cream);color:var(--ok);border:1px solid var(--ok)}.fl.er{background:var(--cream);color:var(--red);border:1px solid var(--red)}
.ck{display:flex;gap:8px;padding:5px 0}.y{color:var(--ok)}.n{color:var(--red)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.mut{color:var(--mut)}
</style></head><body>
<header><div><h1>PAPER &amp; MORE</h1><small>ร้านเครื่องเขียนและอุปกรณ์การเรียน · งวดบัญชี 1–31 กรกฎาคม 2569 · ระบบสินค้าคงเหลือแบบ Periodic</small></div>
<div class="hb"><button onclick="act('smp')" id="bs">โหลดตัวอย่าง</button><button onclick="act('clr')" id="bc">ล้างข้อมูล</button></div></header>
<div class="app"><nav id="nv"></nav><main id="m"></main></div>
<script>
const ACC={101:['เงินสด','D'],102:['เงินฝากธนาคาร','D'],103:['ลูกหนี้การค้า','D'],104:['อุปกรณ์สำนักงาน','D'],201:['เจ้าหนี้การค้า','C'],301:['ทุน','C'],401:['ขาย','C'],'401.1':['รับคืนและส่วนลด','D'],'401.2':['ส่วนลดจ่าย','D'],501:['ซื้อ','D'],'501.1':['ส่งคืนและส่วนลด','C'],'501.2':['ส่วนลดรับ','C'],'501.3':['ค่าขนส่งเข้า','D'],502:['ค่าขนส่งออก','D'],503:['เงินเดือน','D'],504:['ค่าสาธารณูปโภค','D'],505:['ค่าเช่า','D']};
const CODES=[101,102,103,104,201,301,401,401.1,401.2,501,501.1,501.2,501.3,502,503,504,505];
const BOOKS={P:'สมุดรายวันซื้อ',S:'สมุดรายวันขาย',R:'สมุดรายวันรับเงิน',C:'สมุดรายวันจ่ายเงิน',G:'สมุดรายวันทั่วไป'};
const KINDS={P:{buy:'ซื้อสินค้าเป็นเงินเชื่อ'},S:{sale:'ขายสินค้าเป็นเงินเชื่อ'},R:{csale:'ขายสินค้าเป็นเงินสด',ar:'รับชำระหนี้จากลูกหนี้'},C:{ap:'จ่ายชำระหนี้เจ้าหนี้',pay:'จ่ายเงิน (ค่าใช้จ่าย/ค่าขนส่ง/ซื้อสินทรัพย์/คืนเงินลูกค้า)'},G:{cap:'เจ้าของนำสินทรัพย์มาลงทุน',pret:'ส่งคืนสินค้าให้ผู้จำหน่าย',sret:'รับคืนสินค้าจากลูกค้า',man:'รายการอื่น (กำหนดเอง)'}};
const PREF={P:'PJ',S:'SJ',R:'CR',C:'CP',G:'GJ'},DMIN='2026-07-01',DMAX='2026-07-31',PAYDR=[501,501.3,502,503,504,505,104,401.1];
const $=s=>document.querySelector(s),K='pm_acc_v4';
let D,view='dash',edit=null,flash=null,pend=null,subT='c',lsel='all',cb='P';
function load(){try{D=JSON.parse(localStorage.getItem(K))}catch(e){D=null}
if(!D||!D.entries){D={entries:[],log:[],n:1,endInv:null};sample()}}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
const fmt=n=>(+n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bd=i=>{const d=i.split('-');return +d[2]+'/'+d[1]+'/'+(+d[0]+543)};
const r2=x=>Math.round(x*100)/100;
const sorted=es=>[...es].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id);
// ระบบ Periodic: ไม่บันทึกต้นทุนขายและไม่ปรับสินค้าคงเหลือระหว่างงวด
function gen(e){const k=e.kind,a=+e.amount||0,d=+e.disc||0,p=e.party||'',ch=+e.ch||101,m=x=>(x==103||x==201)?p:'';let L;
if(k=='buy')L=[[501,a,0],[201,0,a,p]];
else if(k=='sale')L=[[103,a,0,p],[401,0,a]];
else if(k=='csale')L=[[101,a,0],[401,0,a]];
else if(k=='ar')L=[[101,a-d,0],[401.2,d,0],[103,0,a,p]];
else if(k=='ap')L=[[201,a,0,p],[ch,0,a-d],[501.2,0,d]];
else if(k=='pay')L=[[+e.dr,a,0],[ch,0,a]];
else if(k=='cap')L=[[101,a,0],[102,d,0],[301,0,a+d]];
else if(k=='pret')L=[[201,a,0,p],[501.1,0,a]];
else if(k=='sret')L=[[401.1,a,0],[103,0,a,p]];
else L=[[+e.dr,a,0,m(+e.dr)],[+e.cr,0,a,m(+e.cr)]];
L=L.filter(l=>l[1]||l[2]);return{L,a:L.reduce((s,l)=>s+l[1],0)}}
function validate(es){const er=[],ar={},ap={},cs={101:0,102:0};
for(const e of sorted(es)){const g=gen(e);let d=0,c=0;g.L.forEach(l=>{d+=l[1];c+=l[2]});
if(r2(d)!=r2(c))er.push(e.doc+': เดบิตไม่เท่ากับเครดิต');
if((e.kind=='ar'||e.kind=='ap')&&(+e.disc<0||+e.disc>=+e.amount))er.push(e.doc+': ส่วนลดไม่ถูกต้อง');
g.L.forEach(l=>{if(cs[l[0]]!=null){cs[l[0]]=r2(cs[l[0]]+l[1]-l[2]);if(cs[l[0]]<0)er.push(`${e.doc}: ${ACC[l[0]][0]}ติดลบ`)}
if(l[0]==103||l[0]==201){if(!l[3]){er.push(e.doc+': ไม่ระบุชื่อคู่ค้าสำหรับบัญชีคุม');return}
const m=l[0]==103?ar:ap;m[l[3]]=r2((m[l[3]]||0)+(l[0]==103?l[1]-l[2]:l[2]-l[1]));if(m[l[3]]<0)er.push(`${e.doc}: ยอดคงเหลือของ "${l[3]}" ติดลบ (รับ/จ่าย/คืนเกินยอดหนี้)`)}})}
return[...new Set(er)]}
function led(){const m={};for(const a in ACC)m[a]=[];for(const e of sorted(D.entries))gen(e).L.forEach(l=>m[l[0]].push({e,dr:l[1],cr:l[2],p:l[3]||''}));return m}
const net=rows=>rows.reduce((s,r)=>s+r.dr-r.cr,0);
const bal=(rows,a)=>ACC[a][1]=='D'?net(rows):-net(rows);
function logp(e,t){D.log.unshift({t:new Date().toLocaleString('th-TH'),m:`${t} ${e.doc} (${BOOKS[e.book]}): `+gen(e).L.map(l=>(l[1]?'Dr ':'Cr ')+l[0]+' '+fmt(l[1]||l[2])).join(' / ')});D.log=D.log.slice(0,300)}
function fl(m,er){flash=[m,er];render()}
function fe(m){const b=$('#fb');if(b)b.innerHTML=`<div class="fl er">${esc(m)}</div>`}
const NAV=[['dash','แดชบอร์ด'],['i','สมุดรายวัน'],['jP',BOOKS.P],['jS',BOOKS.S],['jR',BOOKS.R],['jC',BOOKS.C],['jG',BOOKS.G],['i','บัญชี'],['ledger','บัญชีแยกประเภททั่วไป'],['sub','บัญชีย่อยลูกหนี้/เจ้าหนี้'],['tb','งบทดลอง'],['stock','ต้นทุนขาย (Periodic)'],['chk','ตรวจสอบ & ประวัติผ่านรายการ']];
function go(v){view=v;edit=null;pend=null;render();window.scrollTo(0,0)}
function render(){
$('#nv').innerHTML=NAV.map(n=>n[0]=='i'?`<i>${n[1]}</i>`:`<a class="${view==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('');
$('#bs').textContent=pend=='smp'?'ยืนยัน: แทนที่ด้วยตัวอย่าง':'โหลดตัวอย่าง';$('#bc').textContent=pend=='clr'?'ยืนยันล้างทั้งหมด':'ล้างข้อมูล';
if(view[0]=='j')cb=view[1];
$('#m').innerHTML=(flash?`<div class="fl ${flash[1]?'er':'ok'}">${esc(flash[0])}</div>`:'')+(view[0]=='j'?V.j():V[view]());flash=null;
if(view[0]=='j')fill()}
function act(k){if(D.entries.length&&pend!=k){pend=k;render();return}pend=null;
if(k=='clr'){D.entries=[];D.log=[];D.n=1;D.endInv=null;save();fl('ล้างรายการค้าทั้งหมดแล้ว')}else{sample();fl('โหลดรายการค้าเดือนกรกฎาคม 2569 แล้ว')}}
function sample(){D.n=1;D.endInv=null;
const m=(book,date,kind,party,amount,disc,ch,dr,desc)=>({id:D.n++,book,date:'2026-07-'+date,doc:'',kind,party,amount,disc,ch,dr,cr:'',desc});
const MS='บริษัท มีสุข จำกัด',BR='บริษัท โบริ จำกัด',ZZ='บริษัท ซูซู จำกัด';
const es=[m('G','01','cap','',100000,200000,'','','เจ้าของนำเงินสดและเงินฝากธนาคารมาลงทุน'),
m('R','01','csale','',6000,0,'','','ขายเครื่องเขียนและอุปกรณ์การเรียนเป็นเงินสด'),
m('C','03','pay','',250,0,101,502,'จ่ายค่าขนส่งสินค้าที่ขาย'),
m('P','05','buy',MS,8000,0,'','','ซื้อสมุด ปากกา ดินสอ แฟ้มเอกสาร กระดาษ A4 เป็นเงินเชื่อ'),
m('C','05','pay','',300,0,101,501.3,'จ่ายค่าขนส่งสินค้าซื้อ'),
m('G','08','pret',MS,1200,0,'','','ส่งคืนแฟ้มเอกสารและกระดาษ A4 ที่ชำรุด'),
m('C','12','pay','',2000,0,101,401.1,'คืนเงินสดให้ลูกค้ากรณีรับคืนสินค้า (ขายวันที่ 1)'),
m('P','14','buy',BR,49500,0,'','','ซื้อเชื่อ 50,000 หักส่วนลดการค้า 1% (5/15, n/60)'),
m('C','14','pay','',2500,0,101,501.3,'ค่าขนส่งซื้อสินค้า F.O.B. Shipping Point'),
m('G','15','pret',BR,5000,0,'','','ส่งคืนสินค้าให้บริษัท โบริ'),
m('S','16','sale',ZZ,114000,0,'','','ขายเชื่อ 120,000 หักส่วนลดการค้า 5% (5/15, n/60)'),
m('C','16','pay','',2000,0,101,502,'ค่าขนส่งขายสินค้า F.O.B. Destination'),
m('G','17','sret',ZZ,20000,0,'','','รับคืนสินค้าจากบริษัท ซูซู'),
m('C','20','ap',BR,44500,2225,102,'','จ่ายชำระหนี้ด้วยเช็ค ได้ส่วนลด 5%'),
m('C','23','pay','',15000,0,102,505,'จ่ายเช็คค่าเช่าอาคาร'),
m('C','25','pay','',8000,0,101,104,'ซื้อโต๊ะสำนักงานเป็นเงินสด'),
m('C','27','pay','',1200,0,101,504,'จ่ายค่าโทรศัพท์'),
m('C','28','pay','',15000,0,101,503,'จ่ายเงินเดือน'),
m('R','30','ar',ZZ,94000,4700,'','','รับชำระหนี้ หักส่วนลด 5%')];
es.forEach(e=>e.doc=PREF[e.book]+'-'+String(es.filter(x=>x.book==e.book&&x.id<=e.id).length).padStart(3,'0'));
D.entries=es;D.log=[];es.forEach(e=>logp(e,'ผ่านรายการ'));save()}
const opt=l=>l.map(a=>`<option value="${a}">${a} ${ACC[a][0]}</option>`).join('');
const ALL=CODES;
const V={};
V.j=()=>{const b=cb,rows=sorted(D.entries.filter(e=>e.book==b));
return`<h2>${BOOKS[b]}</h2><div class="card"><h3>${edit?'แก้ไขรายการ':'เพิ่มรายการ'}</h3><div id="fb"></div>
<div class="fg" oninput="pv()"><label>วันที่<input type="date" id="f_date" min="${DMIN}" max="${DMAX}"></label>
<label>เลขที่เอกสาร<input id="f_doc"></label><label>ประเภทรายการ<select id="f_kind" onchange="fch()">${Object.entries(KINDS[b]).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>
<label id="l_party"><span id="t_party">ชื่อคู่ค้า</span><input id="f_party" list="dl"></label><datalist id="dl"></datalist>
<label id="l_amt"><span id="t_amt">จำนวนเงิน (บาท)</span><input type="number" id="f_amt" min="0" step="0.01"></label>
<label id="l_disc"><span id="t_disc">ส่วนลด (บาท)</span><input type="number" id="f_disc" min="0" step="0.01"></label>
<label id="l_ch">ชำระด้วย<select id="f_ch"><option value="101">เงินสด</option><option value="102">เงินฝากธนาคาร (เช็ค)</option></select></label>
<label id="l_dr">บัญชีเดบิต<select id="f_dr"></select></label><label id="l_cr">บัญชีเครดิต<select id="f_cr">${opt(ALL)}</select></label>
<label class="w">รายละเอียด<input id="f_desc"></label></div>
<div class="tw" id="pv"></div><p><button onclick="sv()">บันทึกรายการ</button> ${edit?'<button class="s" onclick="go(view)">ยกเลิกแก้ไข</button>':''}</p></div>
<div class="card"><h3>รายการที่บันทึกแล้ว (${rows.length})</h3><div class="tw"><table><tr><th>วันที่</th><th>เลขที่</th><th>รายละเอียด</th><th>คู่ค้า</th><th class="r">จำนวนเงิน</th><th>เดบิต</th><th>เครดิต</th><th></th></tr>
${rows.map(e=>{const g=gen(e),f=i=>g.L.filter(l=>l[i]).map(l=>`${l[0]} ${ACC[l[0]][0]} ${fmt(l[i])}`).join('<br>');
return`<tr><td>${bd(e.date)}</td><td>${esc(e.doc)}</td><td>${esc(e.desc)}</td><td>${esc(e.party)}</td><td class="r">${fmt(g.a)}</td><td>${f(1)}</td><td>${f(2)}</td><td><button class="s" onclick="ed(${e.id})">แก้ไข</button> <button class="${pend=='d'+e.id?'d':'s'}" onclick="del(${e.id})">${pend=='d'+e.id?'ยืนยันลบ':'ลบ'}</button></td></tr>`}).join('')||'<tr><td colspan="8" class="mut">ยังไม่มีรายการ — กดปุ่มโหลดตัวอย่างเพื่อดูรายการค้า หรือเพิ่มรายการด้านบน</td></tr>'}</table></div></div>`};
function fill(){const e=D.entries.find(x=>x.id==edit),s=(i,v)=>{if(v!=null)$('#f_'+i).value=v};
if(e){s('kind',e.kind);fch();s('date',e.date);s('doc',e.doc);s('party',e.party);s('amt',e.amount||'');s('disc',e.disc||'');s('ch',e.ch||101);s('dr',e.dr||'');s('cr',e.cr||101);s('desc',e.desc)}
else{s('date',DMIN);s('doc',PREF[cb]+'-'+String(D.entries.filter(x=>x.book==cb).length+1).padStart(3,'0'));fch()}pv()}
function fch(){const k=$('#f_kind').value,sh=(i,v)=>$('#l_'+i).style.display=v?'':'none';
const pty=['buy','ap','pret'].includes(k)?'ผู้จำหน่าย':['sale','ar','sret'].includes(k)?'ลูกค้า':'';
sh('party',pty||k=='man');$('#t_party').textContent=pty?'ชื่อ'+pty:'ชื่อคู่ค้า (ถ้ามีบัญชี 103/201)';
sh('disc',['ar','ap','cap'].includes(k));$('#t_disc').textContent=k=='cap'?'เงินฝากธนาคาร (บาท)':'ส่วนลด (บาท) ถ้ามี';
$('#t_amt').textContent=k=='cap'?'เงินสด (บาท)':(k=='ar'||k=='ap')?'ยอดหนี้ที่ชำระ (ก่อนหักส่วนลด)':'จำนวนเงิน (บาท)';
sh('ch',k=='ap'||k=='pay');sh('dr',k=='pay'||k=='man');sh('cr',k=='man');
const cur=$('#f_dr').value;$('#f_dr').innerHTML=opt(k=='pay'?PAYDR:ALL);if([...$('#f_dr').options].some(o=>o.value==cur))$('#f_dr').value=cur;
$('#dl').innerHTML=[...new Set(sorted(D.entries).map(e=>e.party).filter(Boolean))].map(p=>`<option value="${esc(p)}">`).join('');pv()}
function rf(){const g=i=>$('#f_'+i).value;return{id:edit||D.n,book:cb,date:g('date'),doc:g('doc').trim(),kind:g('kind'),party:g('party').trim(),amount:+g('amt')||0,disc:+g('disc')||0,ch:g('ch'),dr:g('dr'),cr:g('cr'),desc:g('desc').trim()}}
function pv(){const g=gen(rf());$('#pv').innerHTML=g.a>0?`<table><tr><th>ตัวอย่างการบันทึกบัญชีอัตโนมัติ</th><th class="r">เดบิต</th><th class="r">เครดิต</th></tr>`+g.L.map(l=>`<tr><td>${l[1]?'':'&emsp;'}${l[0]} ${ACC[l[0]]?ACC[l[0]][0]:''}${l[3]?' ('+esc(l[3])+')':''}</td><td class="r">${l[1]?fmt(l[1]):''}</td><td class="r">${l[2]?fmt(l[2]):''}</td></tr>`).join('')+'</table>':''}
function sv(){const e=rf(),k=e.kind,er=[];
if(!e.date||e.date<DMIN||e.date>DMAX)er.push('วันที่ต้องอยู่ในรอบบัญชี 1–31 กรกฎาคม 2569');
if(!e.doc)er.push('กรุณาระบุเลขที่เอกสาร');
if(D.entries.some(x=>x.book==cb&&x.doc==e.doc&&x.id!=e.id))er.push('เลขที่เอกสารซ้ำในสมุดนี้');
if(k=='cap'){if(e.amount<0||e.disc<0||!(e.amount+e.disc>0))er.push('ระบุจำนวนเงินสดหรือเงินฝากธนาคาร')}else if(!(e.amount>0))er.push('จำนวนเงินต้องมากกว่า 0');
if((k=='ar'||k=='ap')&&(e.disc<0||e.disc>=e.amount))er.push('ส่วนลดต้องไม่ติดลบและน้อยกว่ายอดหนี้');
if(k=='man'&&e.dr==e.cr)er.push('บัญชีเดบิตและเครดิตต้องต่างกัน');
if((['buy','sale','ar','ap','pret','sret'].includes(k)||(k=='man'&&[e.dr,e.cr].some(x=>x==103||x==201)))&&!e.party)er.push('กรุณาระบุชื่อคู่ค้า');
if(!['buy','sale','ar','ap','pret','sret','man'].includes(k))e.party='';
if(er.length)return fe(er.join(' • '));
if(!e.desc)e.desc=KINDS[cb][k]+(e.party?' – '+e.party:'');
const old=D.entries.find(x=>x.id==e.id),next=old?D.entries.map(x=>x.id==e.id?e:x):[...D.entries,e],ve=validate(next);
if(ve.length)return fe('บันทึกไม่ได้: '+ve.join(' • '));
if(old){logp(old,'ย้อนกลับ');D.entries=next}else{D.entries=next;D.n++}
logp(e,'ผ่านรายการ');save();edit=null;fl('บันทึกรายการ '+e.doc+' และผ่านไปบัญชีแยกประเภทแล้ว')}
function ed(id){edit=id;render();window.scrollTo(0,0)}
function del(id){if(pend!='d'+id){pend='d'+id;return render()}pend=null;const e=D.entries.find(x=>x.id==id),next=D.entries.filter(x=>x.id!=id),ve=validate(next);
if(ve.length)return fl('ลบไม่ได้ เพราะจะทำให้เกิดความผิดพลาด: '+ve.join(' • '),1);
logp(e,'ย้อนกลับ (ลบ)');D.entries=next;save();fl('ลบรายการ '+e.doc+' และย้อนกลับการผ่านรายการแล้ว')}
const lrows=(a,rows)=>{let b=0;return rows.map(r=>{b+=ACC[a][1]=='D'?r.dr-r.cr:r.cr-r.dr;return`<tr><td>${bd(r.e.date)}</td><td>${esc(r.e.doc)}</td><td>${esc(r.e.desc)}</td><td class="r">${r.dr?fmt(r.dr):''}</td><td class="r">${r.cr?fmt(r.cr):''}</td><td class="r">${fmt(b)}</td></tr>`}).join('')};
V.ledger=()=>{const L=led(),list=lsel=='all'?CODES:[lsel];
return`<h2>บัญชีแยกประเภททั่วไป</h2><div class="tabs"><select onchange="lsel=this.value;render()"><option value="all">ทุกบัญชี</option>${CODES.map(a=>`<option value="${a}" ${lsel==a?'selected':''}>${a} ${ACC[a][0]}</option>`).join('')}</select></div>`+
list.map(a=>`<div class="card"><h3>${a} ${ACC[a][0]}</h3><div class="tw"><table><tr><th>วันที่</th><th>เลขที่</th><th>รายการ</th><th class="r">เดบิต</th><th class="r">เครดิต</th><th class="r">คงเหลือ</th></tr>${lrows(a,L[a])||'<tr><td colspan="6" class="mut">ไม่มีรายการ</td></tr>'}<tfoot><tr><td colspan="3">ยอดคงเหลือ</td><td class="r">${fmt(L[a].reduce((s,r)=>s+r.dr,0))}</td><td class="r">${fmt(L[a].reduce((s,r)=>s+r.cr,0))}</td><td class="r">${fmt(bal(L[a],a))}</td></tr></tfoot></table></div></div>`).join('')};
V.sub=()=>{const a=subT=='c'?103:201,rows=led()[a],ps={};rows.forEach(r=>(ps[r.p]=ps[r.p]||[]).push(r));let tot=0,h='';
for(const p in ps){let b=0;const sg=a==103?1:-1;
h+=`<div class="card"><h3>${esc(p)}</h3><div class="tw"><table><tr><th>วันที่</th><th>เลขที่</th><th>รายการ</th><th class="r">เดบิต</th><th class="r">เครดิต</th><th class="r">คงเหลือ</th></tr>${ps[p].map(r=>{b+=sg*(r.dr-r.cr);return`<tr><td>${bd(r.e.date)}</td><td>${esc(r.e.doc)}</td><td>${esc(r.e.desc)}</td><td class="r">${r.dr?fmt(r.dr):''}</td><td class="r">${r.cr?fmt(r.cr):''}</td><td class="r">${fmt(b)}</td></tr>`}).join('')}</table></div></div>`;tot+=b}
const c=bal(rows,a),ok=r2(tot)==r2(c);
return`<h2>บัญชีย่อย${a==103?'ลูกหนี้':'เจ้าหนี้'}การค้า</h2><div class="tabs"><button class="${a==103?'':'s'}" onclick="subT='c';render()">ลูกหนี้ (ตามชื่อลูกค้า)</button><button class="${a==201?'':'s'}" onclick="subT='s';render()">เจ้าหนี้ (ตามชื่อผู้จำหน่าย)</button></div>
<div class="fl ${ok?'ok':'er'}">รวมบัญชีย่อย ${fmt(tot)} บาท · บัญชีคุม ${a} ${ACC[a][0]} ${fmt(c)} บาท — ${ok?'ตรงกัน ✓':'ไม่ตรงกัน ✗'}</div>`+(h||'<div class="card mut">ยังไม่มีรายการ — กดปุ่มโหลดตัวอย่างเพื่อดูรายการค้า</div>')};
function tbData(){const L=led();let td=0,tc=0;const rows=CODES.map(a=>{const s=net(L[a]),d=s>0?s:0,c=s<0?-s:0;td+=d;tc+=c;return[a,ACC[a][0],d,c]});return{rows,td,tc,ok:r2(td)==r2(tc)}}
V.tb=()=>{const t=tbData();return`<h2>งบทดลอง ณ วันที่ 31 กรกฎาคม 2569</h2><div class="fl ${t.ok?'ok':'er'}">${t.ok?'✓ งบทดลองสมดุล: ยอดเดบิตเท่ากับยอดเครดิต':'⚠ งบทดลองไม่สมดุล! ผลต่าง '+fmt(Math.abs(t.td-t.tc))+' บาท กรุณาตรวจสอบสมุดรายวัน'}</div>
<div class="card"><div class="tw"><table><tr><th>รหัสบัญชี</th><th>ชื่อบัญชี</th><th class="r">ยอดเดบิต</th><th class="r">ยอดเครดิต</th></tr>${t.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="r">${r[2]?fmt(r[2]):''}</td><td class="r">${r[3]?fmt(r[3]):''}</td></tr>`).join('')}<tfoot><tr><td colspan="2">รวม</td><td class="r">${fmt(t.td)}</td><td class="r">${fmt(t.tc)}</td></tr></tfoot></table></div><p class="mut">ดึงยอดคงเหลือจากบัญชีแยกประเภทโดยอัตโนมัติ · ระบบ Periodic ยังไม่ปรับสินค้าคงเหลือปลายงวด</p></div>`};
function fin(){const L=led(),b=a=>bal(L[a],a),sales=b(401)-b(401.1)-b(401.2),pur=b(501)-b(501.1)-b(501.2)+b(501.3),avail=pur,ex=b(502)+b(503)+b(504)+b(505);return{b,sales,pur,avail,ex}}
V.stock=()=>{const f=fin(),b=f.b,ei=D.endInv,cg=ei==null?null:f.avail-ei,R=(t,v,x)=>`<tr${x?' style="font-weight:700"':''}><td>${t}</td><td class="r">${fmt(v)}</td></tr>`;
return`<h2>ต้นทุนขายและกำไร (ระบบ Periodic)</h2><div class="card"><h3>ซื้อสุทธิและสินค้าพร้อมขาย</h3><div class="tw"><table>${R('ซื้อ',b(501))}${R('หัก ส่งคืนและส่วนลด',-b(501.1))}${R('หัก ส่วนลดรับ',-b(501.2))}${R('บวก ค่าขนส่งเข้า',b(501.3))}${R('ต้นทุนซื้อสุทธิ',f.pur,1)}${R('บวก สินค้าต้นงวด (ผังบัญชีไม่มีบัญชีสินค้าคงเหลือ จึงถือว่าไม่มี)',0)}${R('สินค้าพร้อมขาย',f.avail,1)}</table></div></div>
<div class="card"><h3>สินค้าคงเหลือปลายงวด</h3><p class="mut">ระบบ Periodic ต้องนับสินค้าปลายงวดจริง ข้อมูลที่ให้มายังไม่มียอดนี้ ระบบจึงไม่คำนวณต้นทุนขายให้จนกว่าจะกรอก</p><div class="fg"><label>มูลค่าสินค้าปลายงวด (บาท)<input type="number" id="ei" min="0" step="0.01" value="${ei==null?'':ei}"></label></div><button onclick="setEnd()">บันทึก</button></div>
<div class="card"><h3>สรุปผลการดำเนินงาน</h3><div class="tw"><table>${R('ขาย',b(401))}${R('หัก รับคืนและส่วนลด',-b(401.1))}${R('หัก ส่วนลดจ่าย',-b(401.2))}${R('ขายสุทธิ',f.sales,1)}${cg==null?'<tr><td colspan="2" class="mut">ต้นทุนขาย กำไรขั้นต้น และกำไรสุทธิ: ยังไม่คำนวณ (รอมูลค่าสินค้าปลายงวด)</td></tr>':R('หัก ต้นทุนขาย',-cg)+R('กำไรขั้นต้น',f.sales-cg,1)}${R('หัก ค่าใช้จ่ายดำเนินงาน (ขนส่งออก เงินเดือน สาธารณูปโภค ค่าเช่า)',-f.ex)}${cg==null?'':R('กำไร(ขาดทุน)สุทธิ',f.sales-cg-f.ex,1)}</table></div></div>`};
function setEnd(){const v=$('#ei').value;if(v===''){D.endInv=null;save();return fl('ล้างค่าสินค้าปลายงวดแล้ว')}const n=+v,a=fin().avail;if(n<0||n>a)return fl('สินค้าปลายงวดต้องไม่ติดลบและไม่เกินสินค้าพร้อมขาย ('+fmt(a)+')',1);D.endInv=n;save();fl('บันทึกสินค้าปลายงวดแล้ว')}
function checks(){const L=led(),t=tbData(),c=[];let d=0,cr=0;for(const a in L)L[a].forEach(r=>{d+=r.dr;cr+=r.cr});
c.push(['ยอดเดบิตรวมเท่ากับยอดเครดิตรวมในบัญชีแยกประเภท',r2(d)==r2(cr),fmt(d)+' / '+fmt(cr)]);
c.push(['งบทดลองสมดุล',t.ok,fmt(t.td)+' / '+fmt(t.tc)]);
for(const [a,n] of [[103,'ลูกหนี้'],[201,'เจ้าหนี้']]){const m={};L[a].forEach(r=>m[r.p]=(m[r.p]||0)+(a==103?r.dr-r.cr:r.cr-r.dr));const sum=Object.values(m).reduce((x,y)=>x+y,0);c.push([`บัญชีย่อย${n}รวมเท่ากับบัญชีคุม ${a}`,r2(sum)==r2(bal(L[a],a)),fmt(sum)+' / '+fmt(bal(L[a],a))])}
const ve=validate(D.entries);c.push(['เงินสด/เงินฝากไม่ติดลบ, ยอดลูกหนี้/เจ้าหนี้รายตัวไม่ติดลบ, ทุกรายการเดบิต=เครดิต',!ve.length,ve.join(' • ')||'ปกติ']);return c}
V.chk=()=>`<h2>ตรวจสอบความผิดพลาด</h2><div class="card">${checks().map(c=>`<div class="ck"><b class="${c[1]?'y':'n'}">${c[1]?'✓':'✗'}</b><div>${c[0]}<br><span class="mut">${esc(c[2])}</span></div></div>`).join('')}</div>
<div class="card"><h3>ประวัติการผ่านรายการ / ย้อนกลับ</h3>${D.log.map(l=>`<div class="ck"><span class="mut">${esc(l.t)}</span><span>${esc(l.m)}</span></div>`).join('')||'<span class="mut">ยังไม่มีประวัติ</span>'}</div>`;
V.dash=()=>{const f=fin(),b=f.b,ok=checks().every(c=>c[1]),st=(l,v,x)=>`<div class="st"><span>${l}</span><b>${fmt(v)}</b>${x?`<span>${x}</span>`:''}</div>`;
return`<h2>ภาพรวมกิจการ</h2>`+(D.entries.length?'':`<div class="card" style="background:var(--cream)"><h3>เริ่มต้นใช้งาน</h3>กดปุ่มโหลดตัวอย่างเพื่อดูรายการค้า หรือเริ่มบันทึกรายการเองที่เมนูสมุดรายวัน<p><button onclick="act('smp')">กดปุ่มโหลดตัวอย่างเพื่อดูรายการค้า</button></p></div>`)+
`<div class="grid">${st('เงินสด',b(101))}${st('เงินฝากธนาคาร',b(102))}${st('ลูกหนี้การค้า',b(103))}${st('อุปกรณ์สำนักงาน',b(104))}${st('เจ้าหนี้การค้า',b(201))}${st('ทุนเจ้าของกิจการ',b(301))}${st('ขายสุทธิ',f.sales,'หลังหักรับคืนและส่วนลดจ่าย')}${st('ซื้อสุทธิ (รวมค่าขนส่งเข้า)',f.pur)}${st('ค่าใช้จ่ายดำเนินงาน',f.ex)}</div>
<div class="fl ${ok?'ok':'er'}">${ok?'✓ ผ่านการตรวจสอบทุกข้อ (เดบิต=เครดิต, บัญชีย่อย=บัญชีคุม, เงินสด/เงินฝากไม่ติดลบ)':'⚠ พบความผิดพลาด ดูรายละเอียดที่เมนู “ตรวจสอบ”'}</div>
<div class="card"><h3>วิธีใช้งาน</h3>1) เลือกสมุดรายวัน เลือกประเภทรายการ กรอกข้อมูล ระบบแสดงตัวอย่างเดบิต/เครดิต แล้วกดบันทึก<br>2) ระบบผ่านรายการไปบัญชีแยกประเภทและบัญชีย่อยอัตโนมัติ (ซื้อ/ส่งคืน/ส่วนลดบันทึกในบัญชีซื้อสินค้าโดยตรง ไม่แตะสินค้าคงเหลือ)<br>3) สิ้นงวด กรอกมูลค่าสินค้าปลายงวดที่เมนูต้นทุนขาย เพื่อคำนวณต้นทุนขาย<br>4) แก้ไข/ลบ = ย้อนกลับของเดิมแล้วผ่านรายการใหม่ ข้อมูลเก็บในเบราว์เซอร์นี้</div>`};
load();render();
</script></body></html>
